# Routine dependency updates. Two rules across every ecosystem:
#   - security updates land regardless of this file (enabled repo-side) and are
#     NOT suppressed by the semver-major ignore below;
#   - routine *major* bumps are ignored — the repo carries breaking-change-heavy
#     deps (tailwind, react, recharts, storybook, AGP/Kotlin) that need a
#     deliberate, tested upgrade, not an autogenerated PR.
version: 2
updates:
  # JS / TS — one pnpm workspace. Target the root only: Dependabot resolves
  # every workspace package's manifest from here and regenerates the single
  # pnpm-lock.yaml. Listing /packages/* and /apps/* as separate directories
  # bumps the child package.json without updating the root lockfile, so CI's
  # `pnpm install --frozen-lockfile` then fails.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # First, deliberately. A dependency that matches several groups joins the first one it
      # matches, and `react`/`react-dom` are devDependencies in packages/ui and packages/iot — so
      # without this entry above it, `dev-dependencies` would claim them for those manifests.
      #
      # react and react-dom refuse to run at different versions: react-dom throws "Incompatible
      # React versions" while loading, which fails every @kinetixui/ui suite before a single test
      # runs. One-PR-per-dependency therefore produces two pull requests that are each unmergeable
      # by construction — #426 (react 19.3.1) has been red on four consecutive heads for exactly
      # this, and #424 (react-dom 19.3.1) is its mirror image. Grouped, the pair moves together and
      # every resolution stays matched. Measured: both at 19.3.1 passes 628 @kinetixui/ui tests;
      # react alone at 19.3.1 fails 22 of 23 suites at import time.
      react:
        patterns: ["react", "react-dom"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      radix:
        patterns: ["@radix-ui/*"]
      types:
        patterns: ["@types/*"]

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  # Jetpack Compose port
  - package-ecosystem: gradle
    directory: "/packages/ui-compose"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Flutter port
  - package-ecosystem: pub
    directory: "/packages/ui-flutter"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # SwiftUI port
  - package-ecosystem: swift
    directory: "/packages/ui-swiftui"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
