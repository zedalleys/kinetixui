name: Native (SwiftUI)

# Path-filtered so this never runs — and can never fail — on an unrelated
# push; entirely additive, doesn't touch ci.yml / release.yml.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui-swiftui/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/swiftui/**"
      - "scripts/adoption/swiftui-consumer.mjs"
      - "scripts/adoption/swiftui-mirror-consumer.mjs"
  pull_request:
    paths:
      - "packages/ui-swiftui/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/swiftui/**"
      - "scripts/adoption/swiftui-consumer.mjs"
      - "scripts/adoption/swiftui-mirror-consumer.mjs"

permissions:
  contents: read

concurrency:
  group: native-swiftui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/ui-swiftui
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      # The Package.swift target is .macOS(.v13) as well as .iOS(.v16), so
      # `swift build` compiles the SwiftUI sources on the runner with no
      # simulator. This is the sole compiler feedback for the package —
      # the dev box has no Swift toolchain.
      - name: Build
        run: swift build

      # XCTest on the macOS runner: WCAG contrast of the shipped colour sets (light + dark) and the spatial scale.
      - name: Test
        run: swift test

      # The /docs/swiftui setup and first screen, compiled in a clean SwiftPM consumer (macOS, no simulator).
      - name: Documented SwiftUI setup in a clean consumer
        working-directory: .
        run: node scripts/adoption/swiftui-consumer.mjs

      # The other install route: the subtree-split mirror, consumed by URL and a version
      # requirement rather than by path. ci.yml proves the layout layer without a toolchain; this is
      # where `swift package resolve` proves a `from:` requirement actually resolves against the tag.
      # The mirror is a local throwaway directory — nothing is pushed to any remote.
      - name: SwiftUI mirror publish route (resolve + build)
        working-directory: .
        run: node scripts/adoption/swiftui-mirror-consumer.mjs

  # Proves the consumer gate above can fail: each control breaks one documented step (an import, a
  # constructor, an argument label, the package name or path, the platform floor, or a fence) and must
  # fail the gate for that named reason. Compile only, no device or simulator.
  consumer-negative-controls:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        control:
          - missing-import
          - wrong-constructor
          - wrong-argument
          - wrong-package
          - wrong-path
          - platform-floor-too-low
          - fence-missing
    steps:
      - uses: actions/checkout@v4

      - name: "Negative control: ${{ matrix.control }}"
        env:
          CONTROL: ${{ matrix.control }}
        run: node scripts/adoption/swiftui-consumer.mjs --negative="$CONTROL"

  # Proves the semantics and interaction suites can fail. Each control restores a defect one of them
  # was written to catch, runs the suite that detects it, and must fail FOR THAT REASON — a run that
  # fails for any other reason proves nothing and is reported as such. Both claims need a control:
  # a passing `SemanticsTests` says nothing about whether a press is ever carried out. The sabotage
  # happens on the runner's throwaway checkout and is never committed.
  semantics-negative-controls:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The MX1d defect itself: the selected trait keyed on the raw bool, so a mixed box
          # announced itself as selected.
          - control: mixed-reads-as-selected
            suite: SemanticsTests
            file: Sources/KinetixUI/Checkbox.swift
            find: ".accessibilityAddTraits(state.isFullySelected ? [.isSelected] : [])"
            replace: ".accessibilityAddTraits(isOn ? [.isSelected] : [])"
            # Keying the trait on the raw bool leaves the `isOn: false` mixed case correct by accident,
            # so only the `isOn: true` assertion detects it. Its message is the one to match.
            expect: "a mixed box whose underlying value is true must not be announced as selected"
          # The announcement removed altogether: mixed becomes silent again.
          - control: checkbox-value-dropped
            suite: SemanticsTests
            file: Sources/KinetixUI/Checkbox.swift
            find: ".accessibilityValue(state.accessibilityValue)"
            replace: ""
            expect: "Expected exactly one checkbox in the accessibility tree, found 0"
          # The switch stops saying which way it is set.
          - control: switch-value-dropped
            suite: SemanticsTests
            file: Sources/KinetixUI/Switch.swift
            find: '.accessibilityValue(isOn ? "On" : "Off")'
            replace: ""
            expect: "Expected exactly one switch in the accessibility tree, found 0"
          # The interaction claim needs a control of its own: `SemanticsTests` passing says nothing
          # about whether a press is ever carried out. Removing the toggle's own state change leaves a
          # control that still renders and still announces itself, and does nothing when pressed.
          - control: toggle-press-does-nothing
            suite: InteractionTests
            file: Sources/KinetixUI/Toggle.swift
            find: "isOn.toggle()"
            replace: ""
            expect: "pressing a toggle inverts its pressed state, from either state"
    defaults:
      run:
        working-directory: packages/ui-swiftui
    steps:
      - uses: actions/checkout@v4

      # A control compares two runs: the suite green on sound sources, then red once the defect is
      # back. Only the second was ever measured here, and that is how `switch-value-dropped` reported
      # "Control held" on a940aefa while the accessibility walk was finding nothing usable at all —
      # its expected message, "found 0", is what the suite prints for ANY reason the element is
      # missing, a broken harness included. No wording can fix that: "zero of the thing we looked
      # for" is never unique to one cause. The baseline is what makes it unique, so take it first and
      # refuse to go on without it. The step after this one may only ever turn a green suite red.
      - name: "Baseline: ${{ matrix.suite }} must be green BEFORE the defect goes back"
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -o pipefail
          if ! swift test --filter "$SUITE" 2>&1 | tee "$RUNNER_TEMP/baseline.log"; then
            echo "::error::$SUITE is already failing on unmodified sources, so this control can measure nothing: a suite that is red either way cannot tell you the defect was detected. Fix the suite first."
            tail -40 "$RUNNER_TEMP/baseline.log"
            exit 1
          fi
          echo "Baseline green: whatever the next step turns red is the defect."

      - name: "Restore the defect: ${{ matrix.control }}"
        env:
          FILE: ${{ matrix.file }}
          FIND: ${{ matrix.find }}
          REPLACE: ${{ matrix.replace }}
        run: |
          grep -qF -- "$FIND" "$FILE" \
            || { echo "::error::$FIND is no longer in $FILE, so this control no longer restores anything. Update the control or delete it."; exit 1; }
          python3 - "$FILE" "$FIND" "$REPLACE" <<'PY'
          import sys
          path, find, replace = sys.argv[1], sys.argv[2], sys.argv[3]
          src = open(path).read()
          assert src.count(find) == 1, f"{find!r} appears {src.count(find)} times in {path}; a control must be unambiguous"
          open(path, "w").write(src.replace(find, replace))
          PY
          git --no-pager diff --stat

      - name: The suite must now fail, and say why
        env:
          EXPECT: ${{ matrix.expect }}
          SUITE: ${{ matrix.suite }}
        run: |
          # Without pipefail the pipeline reports tee's status, not swift test's, and the
          # control would read every run as a pass.
          set -o pipefail
          if swift test --filter "$SUITE" 2>&1 | tee "$RUNNER_TEMP/control.log"; then
            echo "::error::$SUITE PASSED with the defect restored. The gate does not measure what it claims."
            exit 1
          fi
          # A second net under the baseline above: the harness's own vacuous-pass guard. It only fires
          # when the walk reaches NOTHING below the host, which is why it did not save
          # `switch-value-dropped` on a940aefa — two unlabelled nodes were enough to satisfy it. Kept
          # because it names the cause precisely when it does fire; it is not what makes a control
          # sound, and must not be relied on as if it were.
          if grep -qF -- "reached nothing below the hosted view" "$RUNNER_TEMP/control.log"; then
            echo "::error::The harness itself failed — the walk reached nothing below the hosted view — so this run says nothing about the restored defect, whatever messages it printed."
            tail -40 "$RUNNER_TEMP/control.log"
            exit 1
          fi
          grep -qF -- "$EXPECT" "$RUNNER_TEMP/control.log" \
            || { echo "::error::The suite failed, but not with \"$EXPECT\" — so this control proves nothing."; tail -40 "$RUNNER_TEMP/control.log"; exit 1; }
          echo "Control held: the suite failed for its own reason."
