name: Native (SwiftUI)

# Path-filtered so this never runs — and can never fail — on an unrelated
# push; entirely additive, doesn't touch ci.yml / release.yml.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui-swiftui/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/swiftui/**"
      - "scripts/adoption/swiftui-consumer.mjs"
  pull_request:
    paths:
      - "packages/ui-swiftui/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/swiftui/**"
      - "scripts/adoption/swiftui-consumer.mjs"

permissions:
  contents: read

concurrency:
  group: native-swiftui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/ui-swiftui
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      # The Package.swift target is .macOS(.v13) as well as .iOS(.v16), so
      # `swift build` compiles the SwiftUI sources on the runner with no
      # simulator. This is the sole compiler feedback for the package —
      # the dev box has no Swift toolchain.
      - name: Build
        run: swift build

      # XCTest on the macOS runner: WCAG contrast of the shipped colour sets (light + dark) and the spatial scale.
      - name: Test
        run: swift test

      # The /docs/swiftui setup and first screen, compiled in a clean SwiftPM consumer (macOS, no simulator).
      - name: Documented SwiftUI setup in a clean consumer
        working-directory: .
        run: node scripts/adoption/swiftui-consumer.mjs

  # Proves the consumer gate above can fail: each control breaks one documented step (an import, a
  # constructor, an argument label, the package name or path, the platform floor, or a fence) and must
  # fail the gate for that named reason. Compile only, no device or simulator.
  consumer-negative-controls:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        control:
          - missing-import
          - wrong-constructor
          - wrong-argument
          - wrong-package
          - wrong-path
          - platform-floor-too-low
          - fence-missing
    steps:
      - uses: actions/checkout@v4

      - name: "Negative control: ${{ matrix.control }}"
        env:
          CONTROL: ${{ matrix.control }}
        run: node scripts/adoption/swiftui-consumer.mjs --negative="$CONTROL"
