name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Least privilege at the top level: read-only. Each job raises only what it needs, so the
# preflight job — the one that runs before any decision to publish — has no write access and no
# OIDC identity at all.
permissions:
  contents: read

jobs:
  # Everything the repository can decide for itself about this release, with no credentials in the
  # environment. It cannot publish: it has no npm token and no id-token permission.
  #
  # This is a real gate, not a signal read from another workflow. Polling CI across workflows is
  # fragile in both directions — a green CI run for a different commit, or a race between the two
  # — so the release-critical subset is executed here, in the job that gates publication.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history and tags. This job creates no tags, but it runs `pnpm test:release`, and several
      # of those assertions are about real release tags — that a published version's manifest has not
      # drifted from what shipped, that no unpublishable package carries a tag, that the core cohort's
      # newest tags agree. On a shallow checkout every one of them skips itself, so the gate that is
      # supposed to protect the release was reporting green without running. 629 commits, 47 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The release tooling's own tests. If the thing that decides what may be published is broken,
      # nothing it says afterwards is worth acting on.
      - name: Release tooling tests
        run: pnpm test:release

      # Every workspace package is either allowlisted or private, and every allowlisted package has
      # publication-ready metadata. Offline: this is the check @kinetixui/angular would have failed
      # before 0.23.0 published anything.
      - name: Publish allowlist and package metadata
        run: pnpm release:check

      # The release-critical subset of CI. Not a duplicate of ci.yml — these are the checks whose
      # failure would mean publishing something wrong, rather than something merely unreviewed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test (@kinetixui/ui)
        run: pnpm --filter @kinetixui/ui test

      - name: Test (@kinetixui/create-theme)
        run: pnpm --filter @kinetixui/create-theme test

      # @kinetixui/cli is published by this workflow, and it is how most people install anything at all.
      - name: Test (@kinetixui/cli)
        run: pnpm --filter @kinetixui/cli test

      - name: Changelog page is current with the packages
        run: pnpm check:releases

      - name: Token table matches the tokens
        run: pnpm check:token-contract

      - name: Contrast audit (WCAG AA text pairs)
        run: pnpm check:contrast

      # Build, pack, validate every tarball's entry points, install each one into a clean consumer
      # and use it, then rehearse the upload. Nothing here touches the registry.
      - name: Release preflight (build, pack, artifact validation, consumer smoke tests)
        run: pnpm release:preflight

      - name: Release plan
        run: |
          {
            echo '## KinetixUI release preflight'
            echo '```'
            pnpm --silent release:plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job that can mutate anything. It runs the same preflight again in-process (`pnpm
  # release` is preflight + publish, from one code path) and publishes exactly the artifacts that
  # preflight produced.
  release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets opens the Version PR, and the release pushes its tags
      pull-requests: write
      id-token: write # npm publish provenance (OIDC attestation)
    steps:
      # Full history and tags, which only this job needs. Release tags are verified by the commit
      # they resolve to, and a tag-only recovery has to create them at the commit the release
      # actually went out from — which, once other work has landed on main, is not HEAD. At the
      # default shallow depth that commit is not in the repository and `git tag <sha>` cannot name
      # it. (Preflight also checks out in full, for the tag assertions in its test suite — but it
      # holds no credentials and creates nothing.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create Version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
          # The action's own Release creation works by parsing the Changesets CLI's `New tag:` lines out
          # of the publish command's stdout. `pnpm release` is this repository's own pipeline and prints
          # its own report, so there has never been anything there to parse — which is exactly why npm
          # reached 0.23.3 while the Releases page still showed v0.5.0. Turned off explicitly rather than
          # left at its default, so the next reader knows it is deliberate, and the job is done by the
          # step below from the summary `pnpm release` writes.
          createGithubReleases: false
        env:
          # Where `pnpm release` records what it published and tagged. Read by the next step.
          KINETIXUI_RELEASE_SUMMARY: ${{ runner.temp }}/kinetixui-release.json
          # GITHUB_TOKEN can publish but can't open the Version Packages PR
          # ("GitHub Actions is not permitted to create pull requests" — a
          # deliberate org setting). Add a fine-grained PAT with `contents:write`
          # + `pull-requests:write` as the RELEASE_PAT secret and the PR opens
          # itself; without it, publish still works and the PR is opened by hand.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # Auth: NPM_TOKEN. `pnpm publish` probes OIDC first (the harmless
          # ERR_PNPM_AUTH_TOKEN_EXCHANGE warning) and falls back to the token.
          # To move to token-less publishing, configure a Trusted Publisher for
          # each of @kinetixui/{tokens,ui,cli} on npmjs.com (repo + this
          # workflow filename), then drop these two lines.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # provenance also comes from each package's publishConfig; this env is a
          # harmless extra belt.
          NPM_CONFIG_PROVENANCE: "true"

      # A GitHub Release is a view of a release, never the release itself: npm and the git tags are
      # already correct and irreversible by the time this runs. So it cannot be allowed to fail the job —
      # `continue-on-error`, plus the script exits 0 on a `gh` failure and says what is missing.
      #
      # Creates a Release only for a tag this run pushed for a package this run published, so the 92
      # historical tags are not backfilled with today's date. It never edits a Release that exists.
      #
      # No `if:` guard on the summary file: `hashFiles` only sees paths inside GITHUB_WORKSPACE and the
      # summary is written to the runner temp dir, so a guard built on it would be permanently false and
      # this step would silently never run. The script is a no-op when the file is absent instead, which
      # is the same outcome without a condition that lies.
      - name: GitHub Releases for what was just published
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/github-releases.mjs "${{ runner.temp }}/kinetixui-release.json"
