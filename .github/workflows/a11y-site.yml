name: Accessibility (site)

# Real-browser axe + horizontal-overflow pass over the docs site's OWN pages, light + dark, at phone / tablet /
# desktop width. Complements a11y-browser.yml, which covers the components in Storybook but not the pages built
# from them. Path-filtered so it only runs when something that can change the site's rendering does.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/iot/**"
      - "packages/ui/**"
      - "packages/tokens/**"
      - "tokens/**"
      - "registry/**"
      - "packages/create-theme/**"
      - "packages/create-preset/**"
      - "style-dictionary/**"
      - "scripts/a11y-site.mjs"
      - "scripts/theme-isolation.mjs"
      - "scripts/iot-state-spatial.mjs"
      - "scripts/platform-ticker.mjs"
      # The ticker reads its platforms and labels from these, so a manifest change can move its geometry.
      - "components.manifest.json"
      - "platform-parity.json"
      - ".github/workflows/a11y-site.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/iot/**"
      - "packages/ui/**"
      - "packages/tokens/**"
      - "tokens/**"
      - "registry/**"
      - "packages/create-theme/**"
      - "packages/create-preset/**"
      - "style-dictionary/**"
      - "scripts/a11y-site.mjs"
      - "scripts/theme-isolation.mjs"
      - "scripts/iot-state-spatial.mjs"
      - "scripts/platform-ticker.mjs"
      # The ticker reads its platforms and labels from these, so a manifest change can move its geometry.
      - "components.manifest.json"
      - "platform-parity.json"
      - ".github/workflows/a11y-site.yml"

permissions:
  contents: read

concurrency:
  group: a11y-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `build:iot` is not optional here: /iot imports `@kinetixui/iot/react`, which the exports map resolves
      # to `dist/`, so on a fresh checkout the site build fails to resolve it rather than degrading.
      - name: Build tokens, UI and IoT
        run: pnpm build:tokens && pnpm build:ui && pnpm build:iot

      - name: Build site
        run: pnpm build:web

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `next start` serves the production build. The dev server can't be used here: the site's CSP has no
      # unsafe-eval, so client JavaScript would not run under `next dev`.
      - name: Start the site
        run: |
          nohup pnpm --filter @kinetixui/web start > site.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "site did not start; log:" >&2
          cat site.log >&2
          exit 1

      - name: Axe + overflow pass (every page, light + dark, phone / tablet / desktop)
        run: pnpm check:a11y-site

      # Colour/theme state stays in its preview, light previews on a dark page stay light, and the keyboard
      # focus ring follows a custom theme's --focus (docs/audits/COLOR-THEMING-MATURITY-AUDIT.md).
      - name: Theme isolation + themed focus ring (light + dark site)
        run: pnpm check:theme-isolation
      # The /iot demos' state fidelity and control clearance: relations between rendered things (a stepper and
      # the arc it sits under, a lock's word and its drawing, two plan markers) that axe and overflow cannot see.
      - name: IoT state and spatial pass (ring clearance, lock/light fidelity, plan markers)
        run: pnpm check:iot-state-spatial

      # The homepage platform ticker moves, so its contract is geometric and needs the same running site: one
      # accessible list of the canonical platforms with decorative marks, a seamless gap-free loop in LTR and RTL,
      # a keyboard pause (WCAG 2.2.2), and a static wrapping list under reduced motion, at phone to wide widths and
      # 200% text.
      - name: Platform ticker (loop, pause, reduced motion, RTL, 200% text)
        run: pnpm check:platform-ticker
