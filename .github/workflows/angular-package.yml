name: Angular package

# `@kinetixui/angular` is not published, and this workflow does not publish it. It proves the
# artifact behind that decision is genuinely usable: ng-packagr build, public API snapshot,
# publication simulation, artifact contract, and a clean Angular application outside the workspace
# that installs the packed tarball and runs a production AOT build against it.
#
# Path-filtered on purpose. The consumer build installs a full Angular toolchain, which is not
# something an unrelated pull request should pay for — but any change that can alter the packaged
# artifact does run it.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/ui-angular/**"
      - "packages/tokens/**"
      - "apps/web/src/app/docs/angular/**"
      - "scripts/angular-package/**"
      - "scripts/release/**"
      - "release/publish-packages.json"
      - ".changeset/config.json"
      - ".github/workflows/angular-package.yml"
  push:
    branches: [main]
    paths:
      - "packages/ui-angular/**"
      - "packages/tokens/**"
      - "apps/web/src/app/docs/angular/**"
      - "scripts/angular-package/**"
      - "scripts/release/**"
      - "release/publish-packages.json"
      - ".changeset/config.json"
      - ".github/workflows/angular-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @kinetixui/angular's stylesheet spends the generated token custom properties, and the
      # consumer imports them from the packed @kinetixui/tokens — so the tokens have to exist first.
      - name: Build tokens
        run: pnpm build:tokens

      # The consumer is opened in Chromium to read the documented stylesheet's computed result.
      # Chromium is re-downloaded on every run and the download time is not stable. Measured on #514's head
      # 1a362696, same commit, same trigger: `Install Chromium` took 24s in `Accessibility (browser)` and
      # 9m30s in `Accessibility (site)` — a 24x spread, and on an earlier head it reached 11m10s. In a job
      # that finishes within minutes of its cap, that tail is the whole risk of a cancellation, and a
      # cancellation truncates the run rather than failing loudly.
      #
      # So cache the browser instead of raising `timeout-minutes`, which would move the cliff and hide how
      # close the job sits to it. The cap is deliberately unchanged by this.
      #
      # The key is the pinned Playwright version and nothing else. Playwright pins its browser revisions per
      # version — 1.64.0 wants chromium-1248, chromium_headless_shell-1248 and ffmpeg-1013 — so a version
      # bump is a new key and cannot be served a stale binary. Keying on the lockfile hash instead would
      # miss on every unrelated dependency bump for no benefit.
      #
      # `--with-deps` is kept on a hit: the apt packages it installs live in the system, not in
      # ~/.cache/ms-playwright, so they are not cacheable and must still be installed. With the browser
      # already present, `playwright install` verifies the INSTALLATION_COMPLETE markers and downloads
      # nothing — measured locally as exit 0 with no output.
      - name: Playwright version, for the cache key
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The whole gate: docs/README stylesheet parity, build, API snapshot, DOM-access check,
      # publication simulation, artifact contract, clean external install, production AOT build, a
      # check that the stylesheets reached the bundle, and their rendered result in light and dark.
      - name: Angular publication readiness
        run: pnpm check:angular-package

      # Angular is now an allowlisted, publishable package in its own release cohort. What must
      # stay true is that it releases independently: it is not in the core lockstep, and a release
      # of it never drags tokens/ui/cli along.
      - name: Angular releases independently of the core cohort
        run: |
          node -e '
            const allow = require("./release/publish-packages.json");
            const changesets = require("./.changeset/config.json");
            const entry = allow.packages.find((p) => p.name === "@kinetixui/angular");
            if (!entry) throw new Error("@kinetixui/angular is not in the publish allowlist");
            if (entry.releaseGroup !== "angular") throw new Error("Angular must be in its own release group");
            if (entry.artifactDirectory !== "packages/ui-angular/dist") throw new Error("Angular must pack from its ng-packagr dist");
            const core = allow.packages.filter((p) => p.releaseGroup === "core").map((p) => p.name).sort();
            if (core.join() !== ["@kinetixui/cli", "@kinetixui/tokens", "@kinetixui/ui"].join()) {
              throw new Error("the core cohort changed: " + core.join(", "));
            }
            if (changesets.fixed[0].includes("@kinetixui/angular")) throw new Error("Angular is still in the Changesets fixed group");
            console.log("@kinetixui/angular: own release cohort, packs from dist, core untouched.");
          '

      # The cohort-aware plan and the artifact contract, offline.
      - name: Release cohort planning
        run: pnpm release:check

      - name: Release tooling tests
        run: pnpm test:release

  # Each control removes one step from the documented stylesheet (in memory) and passes only if the
  # gate fails for that step's reason — proof the rendered check can see a forgotten sheet.
  stylesheet-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        control: [no-extras, no-dark, no-extras-dark, readme-drift]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      # Same browser cache as the job above; see that job's note for the key and the measurement.
      - name: Playwright version, for the cache key
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: "Negative control: ${{ matrix.control }}"
        env:
          CONTROL: ${{ matrix.control }}
        run: node scripts/angular-package/check.mjs --negative="$CONTROL"
