name: Create Studio M1
on:
  pull_request:
    paths:
      - "apps/web/src/lib/create-studio/**"
      - "apps/web/src/components/create-studio/**"
      - "apps/web/src/app/create/studio/**"
      - "apps/web/src/app/api/create-studio/**"
      # The editor's application shell: app-chrome.tsx decides whether the editor renders the
      # site header and footer at all, so a change to it is a change to the editor.
      - "apps/web/src/components/app-chrome.tsx"
      - "apps/web/src/components/app-chrome.test.tsx"
      - "docs/create/**"
      - "scripts/create-schema/**"
      - "scripts/create-studio-browser.mjs"
      - "scripts/create-studio-responsive-browser.mjs"
      - "scripts/create-studio-consumer-build.mjs"
      - "scripts/create-studio-workspace-browser.mjs"
      - "scripts/create-studio-resilience-browser.mjs"
      - "scripts/create-studio-resilience-controls.sh"
      - "scripts/create-studio-error-boundary-controls.sh"
      - "scripts/create-studio-recovery-browser.mjs"
      - "scripts/create-studio-recovery-exit-controls.sh"
      - "scripts/create-studio-save-state-browser.mjs"
      - "scripts/create-studio-save-state-controls.sh"
      - "scripts/create-studio-candidate-integrity.sh"
      - "scripts/create-studio-anchor-manifest.mjs"
      - "scripts/create-studio-mutation-anchors.json"
      - "scripts/create-studio-isolated-controls.sh"
      - "scripts/create-studio-reap-disposable.sh"
      - "scripts/create-studio-interruption-safety.sh"
      - "scripts/create-studio-fixture-provenance.mjs"
      - "scripts/create-studio-fixture-provenance-controls.mjs"
      - "scripts/create-studio-concurrency-controls.sh"
      - "scripts/create-studio-concurrency-regressions.sh"
      - ".github/workflows/create-studio.yml"
  # After main receives the code. Unfiltered on purpose: the pull-request path list cannot see a
  # change to packages/ui or the tokens that breaks the editor, so the only place such a break can
  # be caught is a run on main itself. Before this, nothing re-ran these gates after a merge.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: create-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Candidate source assertions
        # Load-bearing lines that a mutation runner replaces, or that a gate would stop being able
        # to assert if residue were committed, PLUS every control mutation in
        # scripts/create-studio-mutation-anchors.json, asserted present and/or absent. A committed
        # mutation is a CLEAN tree, so cleanliness cannot catch one; presence and absence can. This
        # is the check that would have stopped the retry-button residue that reached 4215958a.
        run: bash scripts/create-studio-candidate-integrity.sh assert
      - name: Mutation anchors are the fixed point of the control runners
        # The anchors are generated from the runners, so a control added or changed without
        # regenerating them would leave a mutation nothing can reject. This step also proves each
        # anchor can reject its own mutation, by applying it in memory. Needs no install.
        run: node scripts/create-studio-anchor-manifest.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm --filter @kinetixui/ui build && pnpm --filter @kinetixui/iot build
      - name: Legacy canonical schema remains valid
        run: node scripts/check-create-schema.mjs
      - name: Registry fixed point
        run: pnpm check:registry-fixed-point
      - name: Model, local service and consumer fixture tests
        run: pnpm --filter @kinetixui/web exec vitest run src/lib/create-studio src/components/create-studio src/app/create/studio
        env:
          KINETIX_CREATE_EXPORT_FIXTURE: /tmp/kinetix-create-export-m1
      - name: The export fixture names this commit, and the old presence check would not have noticed
        # The fixture the step above wrote carries a provenance record: the commit it was generated
        # at, a hash per artifact, every link target, and a signature over each built package the
        # bundle embeds. This runs the control for that record — for each way a fixture can be
        # wrong, it requires the old presence-only predicate to ACCEPT it and the new one to
        # REJECT it with a reason. A verifier that rejected everything would pass a one-sided
        # check, so the arms include the positive case.
        run: node scripts/create-studio-fixture-provenance-controls.mjs
        env:
          CREATE_PROVENANCE_FIXTURE: /tmp/kinetix-create-export-m1
      - run: pnpm --filter @kinetixui/web typecheck
      - name: Production build
        run: pnpm --filter @kinetixui/web build
      - name: Browser and accessibility evidence when editor is present
        shell: bash
        run: |
          # This used to `exit 0` when the browser gate was absent, which was right while early
          # storage-only slices genuinely had no editor. Every PR in the current stack carries the
          # gate, so a missing file can now only mean it was lost — and skipping would report a
          # green check having run no browser evidence at all.
          if [ ! -f scripts/create-studio-browser.mjs ]; then
            echo "::error::scripts/create-studio-browser.mjs is missing; refusing to report the editor as verified"
            exit 1
          fi
          pnpm exec playwright install --with-deps chromium
          KINETIX_CREATE_DEV=1 KINETIX_CREATE_DEV_DIR=/tmp/kinetix-create-ci pnpm --filter @kinetixui/web exec next dev --hostname 127.0.0.1 --port 3137 > /tmp/create-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            # The placeholder page returns 200 as well, so a bare `curl --fail` cannot tell the
            # editor from "Create Studio is in development". Require the editor itself.
            body="$(curl --fail --silent http://127.0.0.1:3137/create/studio || true)"
            if printf '%s' "$body" | grep -q 'Create Studio is in development'; then
              echo "::error::the dev server is serving the placeholder; KINETIX_CREATE_DEV did not reach it"
              cat /tmp/create-server.log; exit 1
            fi
            if printf '%s' "$body" | grep -q 'create-studio'; then
              ready=1
              break
            fi
            echo "Waiting for local server, attempt $attempt"
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/create-server.log; exit 1; fi
          # CREATE_REQUIRE_FIXTURE: without the fixture this gate skips the clean consumer bundle
          # and the whole responsive acceptance module and still exits 0 (17 passes, not 21).
          CREATE_ARTIFACTS=/tmp/create-evidence CREATE_EXPORT_FIXTURE=/tmp/kinetix-create-export-m1 CREATE_REQUIRE_FIXTURE=1 node scripts/create-studio-browser.mjs
          # The application-workspace shell: canvas geometry, chrome separation, reachability and
          # the save-state vocabulary, each with its own negative control.
          CREATE_ARTIFACTS=/tmp/create-evidence node scripts/create-studio-workspace-browser.mjs
          # What the editor does when something goes wrong: an unreadable document, a dropped
          # connection, Escape out of the preview, a rename, a hidden panel, a journey away and
          # back. Each assertion carries a control; the source controls that remove the
          # implementations are scripts/create-studio-resilience-controls.sh, which mutates the
          # tree and so is run by hand, not here.
          CREATE_ARTIFACTS=/tmp/create-evidence node scripts/create-studio-resilience-browser.mjs
          # What the editor claims about the user's stored data when a save cannot be confirmed:
          # a commit whose acknowledgement is lost, an unreadable reply, a retry, a conflict,
          # refusing browser storage, and the reconciliation that settles it. The source controls
          # that remove the implementations are scripts/create-studio-save-state-controls.sh, which
          # mutates the tree and so is run by hand, not here.
          CREATE_ARTIFACTS=/tmp/create-evidence node scripts/create-studio-save-state-browser.mjs
          # NOT here: scripts/create-studio-recovery-browser.mjs (#655). It needs a crash trigger
          # that only scripts/create-studio-recovery-exit-controls.sh installs, by mutating source,
          # and it refuses to run without one ("the crash trigger is not installed, so this gate
          # proves nothing"). Invoking it here would fail every run. It belongs with the other
          # source controls, run through scripts/create-studio-isolated-controls.sh so the
          # mutation lands in a disposable worktree — see the M5.24 CI coverage plan.
      - name: Generated React builds in a real consumer project
        # Depends on the fixture the vitest step above writes, and on the built library packages.
        # A separate job would have to rebuild both, so this stays in the same job, after them.
        run: |
          # Was `exit 0` on a missing fixture. The vitest step above writes it whenever this
          # stack's code is present, so a missing fixture now means that coupling broke — and a
          # silent skip would report a consumer production build that never ran.
          if [ ! -f /tmp/kinetix-create-export-m1/index.html ]; then
            echo "::error::no generated export fixture; the vitest step did not write it"
            exit 1
          fi
          CREATE_ARTIFACTS=/tmp/create-evidence \
          CREATE_EXPORT_FIXTURE=/tmp/kinetix-create-export-m1 \
          CREATE_CONSUMER_DIR=/tmp/kinetix-create-consumer-build \
            node scripts/create-studio-consumer-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-studio-evidence
          path: |
            /tmp/create-evidence
            /tmp/create-server.log
          if-no-files-found: ignore

  concurrency-controls:
    # NOT on pull requests. These arms deliver SIGINT and SIGTERM to a real batch at a sweep of
    # delays, run the reaper sixty times against a live one, and start two batches at once; about
    # a quarter of an hour, and the information they carry changes only when the harness changes.
    # They are the durable form of experiments that otherwise lived in a terminal, so what matters
    # is that anyone can re-run them here on request — including the regression cases, which revert
    # each repair inside a disposable worktree and require the matching arm to redden.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # THE LINKAGE ARM NEEDS SOMETHING TO WRITE THROUGH, and `packages/ui/dist` is not committed.
      # Without these steps that arm says CANNOT MEASURE, the suite exits 2, and this job could
      # never succeed or reach the regression prover — it would have failed on its first dispatch.
      # Found in review, before anyone dispatched it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tokens
      - run: pnpm --filter @kinetixui/ui build && pnpm --filter @kinetixui/iot build
      - name: Interruption, ownership and index controls
        # NO_DEV_SERVER is set by the arms themselves: what is under test is the harness's signal
        # handling, ownership and index snapshot, not the editor, and starting a dev server per
        # batch would multiply the runtime for nothing.
        run: bash scripts/create-studio-concurrency-controls.sh
      # THE MANIFEST CASE NEEDS A GENERATED FIXTURE. It reverts the artifact-manifest fixed point
      # and requires the provenance arm to redden, and that arm reads a real fixture. Without this
      # step the case cannot run here at all — on its first dispatch it died silently and the suite
      # still exited 0, which is why the prover now refuses to summarise fewer verdicts than cases.
      - name: Generate the consumer export fixture for the manifest case
        run: pnpm --filter @kinetixui/web --fail-if-no-match exec vitest run src/lib/create-studio/consumer-fixture.test.ts
        env:
          KINETIX_CREATE_EXPORT_FIXTURE: /tmp/kinetix-create-export-m1
      - name: Each control detects a deliberate regression of its repair
        run: bash scripts/create-studio-concurrency-regressions.sh
        env:
          CREATE_PROVENANCE_FIXTURE: /tmp/kinetix-create-export-m1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-studio-concurrency-evidence
          path: |
            /tmp/kinetix-m524/concurrency-controls
            /tmp/kinetix-m524/regressions
          if-no-files-found: ignore
