name: Publish (Compose)

# Manual — publishes packages/ui-compose (com.kinetixui:ui-compose) to Maven
# Central via the Central Portal's OSSRH-compatible staging API. Defaults to
# a dry run (build + unsigned publishToMavenLocal, no upload). A real upload
# needs four secrets; releasing the staged deployment to Central is then a
# manual click at https://central.sonatype.com -> Deployments.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version, e.g. 0.1.0"
        required: true
      dry_run:
        description: "dry run only — build + publishToMavenLocal, no upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Same override as native-compose.yml: the default "tools" package no
      # longer exists in Google's SDK repository.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      # CI provisions a real Gradle directly instead of relying on ./gradlew.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.7.1"

      - name: Dry run — build + publishToMavenLocal (unsigned)
        env:
          VERSION_NAME: ${{ inputs.version }}
        run: gradle :ui:publishReleasePublicationToMavenLocal

      - name: Publish to Maven Central (Portal staging)
        if: ${{ inputs.dry_run == false }}
        env:
          VERSION_NAME: ${{ inputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::error::MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD not set. Create a user token at https://central.sonatype.com/account and add both as repo secrets."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY not set. Run \`gpg --armor --export-secret-keys <key-id>\` and add it (plus SIGNING_KEY_PASSWORD) as repo secrets."
            exit 1
          fi
          gradle :ui:publishReleasePublicationToCentralPortalRepository
          echo "::notice::Uploaded. Release the deployment at https://central.sonatype.com -> Deployments."
