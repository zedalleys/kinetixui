name: Publish (Flutter)

# Manual — publishes packages/ui-flutter to pub.dev. Defaults to a dry run;
# a real publish needs the PUB_DEV_CREDENTIALS secret and `dry_run: false`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "pub.dev version, e.g. 0.1.0"
        required: true
      dry_run:
        description: "dry run only — no publish"
        type: boolean
        default: true

permissions:
  contents: read

# A pub.dev version is permanent once taken; two dispatches must not race for it.
concurrency:
  group: publish-flutter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-flutter
    steps:
      - uses: actions/checkout@v4

      # The preflight now reads these workflows through a YAML parser rather than a
      # hand-written one, because three rounds of review found a spelling the
      # hand-written reader could not see and each time the unread file passed. That
      # costs this workflow its bare-checkout independence: the gate needs its one
      # dependency installed before it can run. It is rehearsal-safe, it runs before
      # anything is validated, and if it fails the job fails and nothing is published.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (the preflight's parser)
        working-directory: .
        run: pnpm install --frozen-lockfile

      # A burnt pub.dev version cannot be reused, so the version is rejected
      # before the toolchain is warmed up.
      - name: Validate version
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-native-publish-preflight.mjs --version="$VERSION"

      - name: Preflight
        working-directory: .
        run: node scripts/check-native-publish-preflight.mjs

      # Shape is not authorization. The step above proves the dispatch input *could* be a version;
      # this proves it is the one release/native-release-lines.json declares for this line, so the
      # number that reaches an irreversible registry has been through review rather than typed into
      # a dispatch box. `authorizedNext: null` there means no publish is authorized, and that is the
      # current declared state.
      #
      # Gated by the publication's own condition, deliberately: a dry run must keep rehearsing the
      # whole release path under any shape-valid version, which is how a defect in that path is
      # found without publishing anything.
      - name: Authorize the version
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-native-publish-preflight.mjs --authorize-version="$VERSION" --line=ui-flutter

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned. `channel: stable` alone floats: on 2026-11-12 stable moved
          # 3.47.9 -> 3.50.0, whose analyzer deprecates `package:flutter/material.dart`
          # and emitted 94 `deprecated_member_use` infos, reddening `Analyze`
          # repo-wide on diffs that touch no Dart. 3.47.9 is the last version this
          # workflow was green on (run #432, 2026-11-11). Bump deliberately, together
          # with the material_ui/cupertino_ui migration -- never with --no-fatal-infos.
          flutter-version: 3.47.9

      - run: flutter pub get

      - name: Test
        run: flutter test

      # Removes `publish_to: none`, writes the version and copies the LICENSE in,
      # asserting each edit afterwards against the file on disk. In a script
      # rather than inline so native-flutter.yml can run this exact staging on a
      # throwaway copy on every pull request — the old inline `sed` was only ever
      # executed by a real dispatch, and `sed` exits 0 when it matches nothing.
      - name: Stage for publish
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/publish/stage-flutter-package.mjs "$VERSION"

      - name: Dry run
        run: flutter pub publish --dry-run

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}
        run: |
          if [ -z "$PUB_DEV_CREDENTIALS" ]; then
            echo "::error::PUB_DEV_CREDENTIALS is not set. Run \`dart pub login\` locally and add the contents of ~/.config/dart/pub-credentials.json as that secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_DEV_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          flutter pub publish --force
