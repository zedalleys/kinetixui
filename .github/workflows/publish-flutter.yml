name: Publish (Flutter)

# Manual — publishes packages/ui-flutter to pub.dev. Defaults to a dry run;
# a real publish needs the PUB_DEV_CREDENTIALS secret and `dry_run: false`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "pub.dev version, e.g. 0.1.0"
        required: true
      dry_run:
        description: "dry run only — no publish"
        type: boolean
        default: true

permissions:
  contents: read

# A pub.dev version is permanent once taken; two dispatches must not race for it.
concurrency:
  group: publish-flutter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-flutter
    steps:
      - uses: actions/checkout@v4

      # A burnt pub.dev version cannot be reused, so the version is rejected
      # before the toolchain is warmed up.
      - name: Validate version
        working-directory: .
        run: node scripts/check-native-publish-preflight.mjs --version='${{ inputs.version }}'

      - name: Preflight
        working-directory: .
        run: node scripts/check-native-publish-preflight.mjs

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - run: flutter pub get

      - name: Test
        run: flutter test

      - name: Stage for publish
        run: |
          # `pub publish` refuses `publish_to: none`; it also wants a LICENSE
          # in the package directory. Both are set up here, not committed.
          sed -i '/^publish_to:/d' pubspec.yaml
          sed -i "s/^version: .*/version: ${{ inputs.version }}/" pubspec.yaml
          cp ../../LICENSE ./LICENSE
          # sed exits 0 when it matches nothing, so assert the staging actually
          # happened rather than publishing the committed 0.0.0.
          grep -qx 'version: ${{ inputs.version }}' pubspec.yaml \
            || { echo '::error::Staging did not set the version in pubspec.yaml.'; exit 1; }
          ! grep -q '^publish_to:' pubspec.yaml \
            || { echo '::error::Staging did not remove publish_to from pubspec.yaml.'; exit 1; }

      - name: Dry run
        run: flutter pub publish --dry-run

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        env:
          PUB_DEV_CREDENTIALS: ${{ secrets.PUB_DEV_CREDENTIALS }}
        run: |
          if [ -z "$PUB_DEV_CREDENTIALS" ]; then
            echo "::error::PUB_DEV_CREDENTIALS is not set. Run \`dart pub login\` locally and add the contents of ~/.config/dart/pub-credentials.json as that secret."
            exit 1
          fi
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_DEV_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          flutter pub publish --force
