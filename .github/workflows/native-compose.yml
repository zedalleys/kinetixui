name: Native (Compose)

# Path-filtered so this never runs — and can never fail — on an unrelated
# push; entirely additive, doesn't touch ci.yml / release.yml.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui-compose/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/compose/**"
      - "scripts/adoption/compose-consumer.mjs"
  pull_request:
    paths:
      - "packages/ui-compose/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/compose/**"
      - "scripts/adoption/compose-consumer.mjs"

permissions:
  contents: read

concurrency:
  group: native-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # `packages` defaults to "tools platform-tools" — the standalone
      # "tools" package was removed from Google's SDK repository, so the
      # default now fails outright. Only platform-tools is actually needed;
      # AGP/Gradle auto-download the compileSdk platform + build-tools.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      # Cache Gradle and validate the committed wrapper. Build through the
      # wrapper so dependency PRs exercise the version used locally too.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Assemble
        run: ./gradlew :ui:assembleDebug

      # Compose UI tests on Robolectric (JVM, no emulator): interaction, accessibility semantics, RTL.
      - name: Test
        run: ./gradlew :ui:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ui:lintDebug

      # BASELINE measurement of the current /docs/compose first screen in a clean consumer.
      - name: "Baseline: control screen in the clean consumer"
        working-directory: .
        env:
          KINETIX_CONTROL: "1"
        run: node scripts/adoption/compose-consumer.mjs

      - name: "Baseline: docs fence pasted verbatim"
        id: verbatim
        continue-on-error: true
        working-directory: .
        run: node scripts/adoption/compose-consumer.mjs

      - name: "Baseline: docs fence wrapped in a @Composable function"
        id: wrapped
        continue-on-error: true
        working-directory: .
        env:
          KINETIX_WRAP_LEGACY: "1"
        run: node scripts/adoption/compose-consumer.mjs

      - name: Baseline outcomes
        working-directory: .
        run: |
          echo "verbatim=${{ steps.verbatim.outcome }} wrapped=${{ steps.wrapped.outcome }}"
          test "${{ steps.verbatim.outcome }}" = success && test "${{ steps.wrapped.outcome }}" = success
