name: Native (Compose)

# Path-filtered so this never runs — and can never fail — on an unrelated
# push; entirely additive, doesn't touch ci.yml / release.yml.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui-compose/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/compose/**"
      - "scripts/adoption/compose-consumer.mjs"
      - ".github/workflows/native-compose.yml"
  pull_request:
    paths:
      - "packages/ui-compose/**"
      - "tokens/**"
      - "style-dictionary/**"
      - "apps/web/src/app/docs/compose/**"
      - "scripts/adoption/compose-consumer.mjs"
      - ".github/workflows/native-compose.yml"

permissions:
  contents: read

concurrency:
  group: native-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # `packages` defaults to "tools platform-tools" — the standalone
      # "tools" package was removed from Google's SDK repository, so the
      # default now fails outright. Only platform-tools is actually needed;
      # AGP/Gradle auto-download the compileSdk platform + build-tools.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      # Cache Gradle and validate the committed wrapper. Build through the
      # wrapper so dependency PRs exercise the version used locally too.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Assemble
        run: ./gradlew :ui:assembleDebug

      # Compose UI tests on Robolectric (JVM, no emulator): interaction, accessibility semantics, RTL.
      - name: Test
        run: ./gradlew :ui:testDebugUnitTest

      - name: Lint
        run: ./gradlew :ui:lintDebug

      # The /docs/compose setup and first screen, built and tested in a clean consumer app.
      - name: Documented Compose onboarding in a clean consumer
        working-directory: .
        run: node scripts/adoption/compose-consumer.mjs

  # The version in a Maven coordinate is the one thing a publish cannot take
  # back, and the build script used to fall back to a silent "0.1.0" whenever
  # VERSION_NAME failed to arrive. These two steps are the proof that it no
  # longer can: one publishes to the local repository and reads the version
  # back off the artifact, the other withholds VERSION_NAME and requires the
  # publish task to refuse. No credentials, no signing, no remote — mavenLocal
  # only, so nothing here can reach Central.
  publish-version-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: The published artifact carries exactly the requested version
        env:
          VERSION_NAME: 9.9.9-integrity-probe
        run: |
          set -euo pipefail
          ./gradlew :ui:publishReleasePublicationToMavenLocal
          DIR="$HOME/.m2/repository/com/kinetixui/ui-compose/$VERSION_NAME"
          POM="$DIR/ui-compose-$VERSION_NAME.pom"
          if [ ! -f "$POM" ]; then
            echo "::error::Expected the publication at $POM. The version the build used is not the one that was requested."
            find "$HOME/.m2/repository/com/kinetixui" -maxdepth 2 -type d || true
            exit 1
          fi
          # The directory name comes from Gradle; the POM body is what a
          # consumer actually resolves, so assert the version there too.
          if ! grep -qF "<version>$VERSION_NAME</version>" "$POM"; then
            echo "::error::$POM does not declare <version>$VERSION_NAME</version>."
            grep -m5 "<version>" "$POM" || true
            exit 1
          fi
          test -f "$DIR/ui-compose-$VERSION_NAME.aar"
          echo "::notice::ui-compose published locally as $VERSION_NAME, version confirmed in the POM."

      - name: A publish without VERSION_NAME is refused, not defaulted
        run: |
          set -uo pipefail
          # Deliberately no VERSION_NAME in the environment.
          if ./gradlew :ui:publishReleasePublicationToMavenLocal > "$RUNNER_TEMP/refusal.log" 2>&1; then
            echo "::error::The publish task succeeded with no VERSION_NAME set. It must refuse rather than fall back to a default version."
            find "$HOME/.m2/repository/com/kinetixui" -maxdepth 2 -type d || true
            exit 1
          fi
          if ! grep -q "VERSION_NAME is not set" "$RUNNER_TEMP/refusal.log"; then
            echo "::error::The publish task failed, but not with the VERSION_NAME refusal — so this control proves nothing about version integrity."
            tail -40 "$RUNNER_TEMP/refusal.log"
            exit 1
          fi
          # The old failure mode left a real artifact behind under the silent
          # default, which is the thing that would have reached Central.
          for STRAY in 0.1.0 0.0.0-unversioned; do
            if [ -d "$HOME/.m2/repository/com/kinetixui/ui-compose/$STRAY" ]; then
              echo "::error::A publication was produced under $STRAY despite the refusal."
              exit 1
            fi
          done
          echo "::notice::Refused as required, and no artifact was produced under a default version."

  # Proves the consumer gate above can fail: each control breaks one documented step (an import,
  # a component, a dependency, module registration, the activity, validation, the email field's name,
  # duplicated label or unexposed error, the switch's state or name, or a fence) and must fail the gate for that named reason. JVM/Robolectric only, no device.
  consumer-negative-controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        control:
          - missing-import
          - missing-component
          - missing-dependency
          - module-not-registered
          - activity-not-wired
          - validation-broken
          - switch-unresponsive
          - email-unnamed
          - email-label-duplicated
          - email-error-unexposed
          - switch-unnamed
          - switch-row-merge
          - fence-missing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: "Negative control: ${{ matrix.control }}"
        env:
          CONTROL: ${{ matrix.control }}
        run: node scripts/adoption/compose-consumer.mjs --negative="$CONTROL"
