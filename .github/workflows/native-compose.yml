name: Native (Compose)

# Path-filtered so this never runs — and can never fail — on an unrelated
# push; entirely additive, doesn't touch ci.yml / release.yml.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui-compose/**"
      - "tokens/**"
      - "style-dictionary/**"
  pull_request:
    paths:
      - "packages/ui-compose/**"
      - "tokens/**"
      - "style-dictionary/**"

permissions:
  contents: read

concurrency:
  group: native-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # `packages` defaults to "tools platform-tools" — the standalone
      # "tools" package was removed from Google's SDK repository, so the
      # default now fails outright. Only platform-tools is actually needed;
      # AGP/Gradle auto-download the compileSdk platform + build-tools.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools"

      # CI provisions a real Gradle directly instead of relying on
      # ./gradlew (the wrapper jar is committed for local/Android Studio use
      # — see packages/ui-compose/README.md — but CI doesn't depend on it).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.7.1"

      - name: Assemble
        run: gradle :ui:assembleDebug

      - name: Lint
        run: gradle :ui:lintDebug
