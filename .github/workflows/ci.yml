name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, for the tags. The release tooling asserts against real release tags — that a
      # published version's manifest has not drifted, that no unpublishable package carries a tag —
      # and on the default shallow checkout every one of those assertions skipped itself. They were
      # green here for years without ever running. 629 commits and 47 MB is a cheap fix for that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      # The release safety layer, tested like anything else. Pure planning logic: no network, no
      # subprocess, nothing published.
      - name: Test (release tooling)
        run: pnpm test:release

      # Every workspace package is either allowlisted for npm in release/publish-packages.json or
      # carries `private: true`, and every allowlisted package has publication-ready metadata.
      # A package that is neither fails here, on the pull request that introduced it, rather than
      # at the registry halfway through a release — which is how @kinetixui/angular took 0.23.0
      # down with it. Offline, so it passes on an ordinary PR whose version is already on npm.
      - name: Publish allowlist and package metadata
        run: pnpm release:check

      - name: Website component dogfooding (reviewed native-pattern ratchet)
        run: pnpm check:web-dogfooding

      - name: Lint
        run: pnpm lint

      - name: Contrast audit (WCAG AA text pairs)
        run: pnpm check:contrast

      # The browser axe pass is path-filtered; this checks the filter still covers every package
      # that has stories, so a package cannot drift outside the accessibility gate unnoticed.
      - name: Accessibility gate covers every package with stories
        run: pnpm check:a11y-coverage

      # A field's visible label has to name the field. No <label> that labels nothing, and every
      # rendered `label` prop proven to reach its control's accessible name — axe cannot see this,
      # because a trigger with the wrong name still has a name.
      - name: A visible label names its field
        run: pnpm check:label-association

      - name: Token table matches the tokens
        run: pnpm check:token-contract

      # Motion values agree across the source, web CSS and the six native files; no motion token name
      # is referenced that does not exist; tokens/contracts/motion.json still matches the components it names.
      - name: Motion tokens and contract agree
        run: pnpm check:motion-tokens

      - name: Changelog page is current with the packages
        run: pnpm check:releases

      # A README is read on GitHub, on npmjs.com and in node_modules. A relative link out of the package
      # directory only works in the first, so published READMEs link outside themselves with absolute URLs.
      - name: Published READMEs link only to what their readers can reach
        run: pnpm check:package-readmes

      - name: RTL logical-property guardrail
        run: pnpm check:rtl

      # Corners and shadows in the SwiftUI package come from the theme, not from literals. Runs here
      # rather than in `swift test` so it checks every pull request, not only the ones that trip the
      # macOS workflow's path filter.
      - name: SwiftUI radius/elevation token guardrail
        run: pnpm check:swiftui-tokens

      # Reusable component source reads colour from semantic roles: no palette utilities, no primitives,
      # no raw hex/rgb/hsl, on every platform. A reviewed allowlist in the script carries the exceptions.
      - name: Component colour-contract guardrail (semantic roles only)
        run: pnpm check:component-colors

      # Compose's KinetixColors is a data class, so its PARAMETER ORDER is public API: positional callers
      # and `componentN()` both read it. The snapshot makes an inserted or reordered role a reviewable
      # diff, and the script refuses a required parameter declared after a defaulted one.
      - name: Compose colour API snapshot is current
        run: pnpm check:compose-api

      # The three native packages publish through workflow_dispatch workflows that have never run
      # for real, and each ends at a door that only opens outwards: an immutable Central coordinate,
      # a permanent pub.dev version, a git tag `from:` resolves against forever. This checks the
      # part that cannot be checked afterwards — the mirror layout, the POM fields Central requires,
      # pub.dev's metadata, the publish workflows' own safety, and vendored token currency. Source
      # and workflow properties only, so it runs here rather than needing three toolchains.
      - name: Native publish preflight
        run: pnpm check:native-publish-preflight

      # Proves the preflight can fail: each control breaks one property it asserts.
      - name: "Native publish preflight: negative controls"
        run: |
          for control in $(node scripts/check-native-publish-preflight.mjs --list-negatives); do
            echo "--- $control"
            node scripts/check-native-publish-preflight.mjs --negative="$control"
          done

      # packages/ui-swiftui reaches a consumer as a `git subtree split` pushed to a mirror and
      # resolved by `.package(url:, from:)`, which scripts/adoption/swiftui-consumer.mjs cannot
      # cover because it resolves the vendored path. The layout layer needs no Swift; native-swiftui.yml
      # runs the resolve/build layer on macOS. Local throwaway mirror, no remote is contacted.
      - name: SwiftUI mirror publish route (layout)
        run: node scripts/adoption/swiftui-mirror-consumer.mjs --layout-only

      - name: "SwiftUI mirror publish route: negative controls"
        run: |
          for control in $(node scripts/adoption/swiftui-mirror-consumer.mjs --list-negatives); do
            echo "--- $control"
            node scripts/adoption/swiftui-mirror-consumer.mjs --negative="$control"
          done

      - name: Typography alias guardrail
        run: pnpm check:typography

      - name: Type scale stays relative and matches the canonical tokens
        run: pnpm check:type-scale

      - name: Spatial grid guardrail (8-unit grid, 4-unit half-step)
        run: pnpm check:grid

      # What each platform implementation has actually been verified to do, derived from the test files
      # themselves. check:manifest below refuses a declared platform maturity this evidence does not support,
      # which is the gate that stops "the source file exists" from being printed as "stable".
      # Two accessibility suites take their SUBJECTS from the story directory, so a component with no story
      # is a component nothing checks — silently. That is how direction-provider went unchecked. This fails
      # on a missing, drifted or orphaned story, and on any manifest component with no story at all.
      - name: Storybook story coverage (the accessibility suites' subject set)
        run: pnpm check:stories

      # What each platform implementation has actually been verified to do, derived from the test files
      # themselves. This is verification maturity, which is NOT package maturity and NOT component lifecycle.
      - name: Verification evidence is current with the tests
        run: pnpm check:verification

      - name: Component manifest check (status, platforms, guidance, maturity)
        run: pnpm check:manifest

      # The business capability roadmap may only call something existing if the manifest, the IoT package,
      # the blocks manifest or a file says so; its tables are generated from docs/business-capabilities.json.
      - name: Business capability roadmap is truthful and current
        run: pnpm check:capabilities

      # Keyboard documentation is derived from the keyboard tests, so a behaviour that stops being tested
      # stops being documented. This fails if the two have drifted apart.
      - name: Keyboard documentation is current with the keyboard tests
        run: pnpm check:keyboard

      # A manifest claim is not evidence. This checks the other direction: that source exists behind every
      # declared platform, and that source which exists is declared. React and Angular are checked
      # structurally (the symbol must be exported from the package's entry point); the three native platforms
      # are checked at file level, because their symbols live behind compilers this step cannot run — their
      # real gate is native-*.yml.
      - name: Declared platforms are backed by real source
        run: pnpm check:platform-source

      - name: Platform completeness (every catalogue/platform cell resolved)
        run: pnpm check:platform-completeness

      # Bookkeeping, not accessibility verification: it catches a native component that starts
      # animating without ever being wired to the reader's reduced-motion setting, a family member
      # losing that contract, a suite testing only one direction, and a stale gap ledger. The
      # behavioural proof lives in the three native suites, run by their own workflows.
      - name: Native motion ledger (animated components answer to the reader's setting)
        run: pnpm check:native-motion

      # A block may only advertise a platform it has real source for, and the snippets the site shows must
      # be the current contents of those files. React is structural (the same fixture renders the live
      # preview); the native sources are compiled by native-*.yml, not here.
      # Every native snippet a component page shows must be real: matched against a compiled example where
      # one exists, and otherwise symbol-checked against that platform's package. A snippet for a platform
      # the component is not on must be declared as a composition, with a reason.
      - name: Component snippet verification (no invented native APIs)
        run: pnpm check:platform-code

      - name: Usage example drift check (generated vs. the compiled native sources)
        run: pnpm check:usage

      - name: Block source verification (every declared platform has a real file)
        run: pnpm check:block-source

      - name: Block snippet drift check (generated vs. the real source files)
        run: pnpm check:blocks

      # The same drift check for the IoT examples, which are a separate layer because a published
      # Block must carry all five platforms and @kinetixui/iot is React-only. This caught a stale
      # snippet on its first real run: a source file was edited and the extraction was not rerun.
      - name: IoT example drift check (generated vs. the real composition files)
        run: pnpm check:iot-examples

      - name: Flagship example drift check (homepage source vs. the four CI-compiled example files)
        run: pnpm check:flagship-examples

      - name: Icon mapping drift check
        run: pnpm check:icons

      - name: Build @kinetixui/ui
        run: pnpm build:ui

      - name: Build registry
        run: pnpm build:registry

      # Every npm package a registry item's delivered files import must be one it declares. 91 of 97 items
      # shipped lib/utils.ts without declaring its clsx and tailwind-merge imports, so `add card` exited 0
      # and left a project that could not build. Runs after the build so it checks what would be served.
      - name: Registry dependency completeness
        run: pnpm check:registry-deps

      # The registry does not deliver the preset's global reduced-motion floor, so the one promise a delivered
      # file can keep itself is that every loop it ships states its own reduced form. Reads the same served
      # payloads as the check above, because those are what a consumer receives.
      - name: Registry reduced-motion floor
        run: pnpm check:registry-motion

      # `pnpm typecheck` type-checks the IoT source, which is not the same as proving it bundles: the
      # three entry points, the .d.ts rollup and the `exports` map's paths are all produced here. Without
      # this step a broken build would first appear during a release, which is the worst place for it.
      - name: Build @kinetixui/iot
        run: pnpm build:iot

      # The React-free guarantee, checked on the artifact rather than the source. The package's own suite
      # walks the source import graph; this walks `dist`, so a bundler or chunking change that put React
      # back into the pure entry point cannot reach npm. It also catches a stale chunk `files: ["dist"]`
      # would publish, which is why the build above carries --clean.
      - name: IoT dist boundary (@kinetixui/iot/functions is React-free)
        run: pnpm check:iot-dist

      # ng-packagr runs the full Angular compiler with strictTemplates, so this is the package's typecheck as
      # well as its build — every template is compiled, not just the TypeScript around it. A regression here
      # fails CI like any other.
      - name: Build @kinetixui/angular (AOT + strict template typecheck)
        run: pnpm build:angular

      # That build compiles only what src/public-api.ts reaches, and no block is reachable from there. This
      # compiles every Angular block in blocks.manifest.json (tsconfig.blocks.json) with the same strict
      # templates, after a negative control proves the gate rejects a wrong-typed binding. It is what makes
      # Angular blocks Build verified in verification.json; remove it and they fall back to Source present.
      - name: Compile the Angular blocks (strict templates)
        run: pnpm check:angular-blocks

      # The Angular package's public surface — every exported symbol, selector, input and output —
      # as a file review can diff. Cheap here because the build above already produced the .d.ts it
      # reads; the expensive external-consumer proof lives in angular-package.yml.
      - name: Angular public API snapshot is current
        run: pnpm check:angular-api

      # Preview → Stable is a contract, not a count (ANGULAR-GRADUATION.md). This fails if Angular is
      # declared stable while any graduation criterion is unmet, if catalogComplete is claimed with planned
      # entries, or if the package README's published numbers drift from the manifest and the evidence.
      - name: Angular graduation contract (Preview stays Preview until it is earned)
        run: pnpm check:angular-graduation

      - name: Test (@kinetixui/angular)
        run: pnpm test:angular

      # The shared theme engine: colour maths, semantic derivation and the web CSS exporter, in isolation.
      # It has no DOM and no React, and its vitest environment is `node` so it cannot quietly acquire one.
      - name: Test (@kinetixui/create-theme)
        run: pnpm --filter @kinetixui/create-theme test

      # The CLI is the primary activation path — `npx @kinetixui/cli add` — and had no tests at all until
      # Phase 0.5. It is also published, so a regression here ships.
      - name: Test (@kinetixui/cli)
        run: pnpm --filter @kinetixui/cli test

      - name: Test (@kinetixui/ui)
        run: pnpm --filter @kinetixui/ui test

      # The IoT module: classification edge cases, rendered a11y over its primitives, and the assertion
      # that `@kinetixui/iot/functions` imports no React — named explicitly because this job lists its
      # test steps rather than running `turbo run test`, so a new package is invisible here until it is
      # added by hand.
      - name: Test (@kinetixui/iot)
        run: pnpm --filter @kinetixui/iot test

      - name: Test (@kinetixui/web - changelog search, URL state, release notes)
        run: pnpm --filter @kinetixui/web test

      # The distribution register is where campaign results are written down. This holds it to analytics.md
      # §10 (absolute counts, no verdict, before a baseline exists) and to the content register and route list.
      # It used to run only by hand at close-out, so nothing enforced the baseline rule on a PR.
      - name: Distribution register (campaign results, baseline rule)
        run: pnpm check:distribution

      # The content register: ids, statuses, campaign links analytics will keep, and explicit approvals. It
      # existed since Phase 4 but ran only by hand, so a register edit that check:distribution does not read
      # (a drafted asset's campaign, an approval with no evidence) could merge unchecked.
      - name: Content register (campaign ids, attribution, approvals)
        run: pnpm check:content

      - name: Generated files in sync
        run: |
          # The native packages carry vendored copies of packages/tokens/dist/{android,ios,flutter};
          # re-vendor so a token change that wasn't copied across shows up in the diff below.
          node scripts/vendor-compose-tokens.mjs
          node scripts/vendor-swiftui-tokens.mjs
          node scripts/vendor-flutter-tokens.mjs
          git add -N packages/ui-compose packages/ui-swiftui packages/ui-flutter
          if ! git diff --exit-code -- \
            packages/tokens/dist \
            packages/ui-compose \
            packages/ui-swiftui \
            packages/ui-flutter \
            apps/web/public/r \
            apps/web/public/specs \
            registry/registry.json \
            registry/kinetixui \
            specs/components \
            component-status.json \
            platform-parity.json \
            block-parity.json \
            verification.json \
            packages/ui/src/stories \
            apps/web/src/registry/block-examples.generated.ts \
            apps/web/src/registry/usage-examples.generated.ts \
            apps/web/src/registry/keyboard.generated.ts; then
            echo "::error::Generated output is stale. Run 'pnpm gen:keyboard && pnpm gen:verification && pnpm gen:manifest && pnpm build:tokens && pnpm vendor:compose && pnpm vendor:swiftui && pnpm vendor:flutter && pnpm gen:stories && pnpm build:registry' and commit the result."
            exit 1
          fi

      - name: Documented React onboarding in a clean consumer
        run: node scripts/adoption/react-consumer.mjs

      - name: Build site
        run: pnpm build:web

      # Reads the prerendered HTML, sitemap.xml and robots.txt the build just wrote: titles, descriptions and
      # canonicals on every page, sitemap ↔ pages, internal links, OG images, JSON-LD and breadcrumbs. Rules and
      # negative controls: marketing/seo/SEO-BASELINE.md.
      - name: SEO gate (built HTML, sitemap, robots)
        run: pnpm check:seo

      # The editorial layer on top: component intros and guides, typed counts on platform pages, one owner per
      # search intent, near-duplicate titles/descriptions. Rules and negative controls: scripts/check-editorial.mjs,
      # scripts/editorial-negative-controls.mjs.
      - name: Editorial gate (intros, intent ownership, typed counts)
        run: pnpm check:editorial

      # A release note's links, against the pages the build just wrote: the path and the #fragment.
      # 0.25.0's notes linked /docs/motion, a route that does not exist, and nothing in the pipeline
      # resolved it — the curated note is not on any page until the Version PR activates it, and
      # check:seo strips the fragment before resolving. Same inventory as check:seo, no second route list.
      - name: Release note links resolve (paths and anchors)
        run: pnpm check:release-links

      # Every workspace with a `typecheck` script (@kinetixui/ui, @kinetixui/cli, @kinetixui/web) via turbo.
      # Was `--filter @kinetixui/ui` + `continue-on-error`, which let real apps/web type errors through unseen.
      - name: Typecheck (all workspaces)
        run: pnpm typecheck
