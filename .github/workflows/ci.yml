name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      - name: Contrast audit (WCAG AA text pairs)
        run: pnpm check:contrast

      - name: RTL logical-property guardrail
        run: pnpm check:rtl

      - name: Typography alias guardrail
        run: pnpm check:typography

      - name: Component lifecycle status check
        run: pnpm check:status

      - name: Icon mapping drift check
        run: pnpm check:icons

      - name: Build @kinetixui/ui
        run: pnpm build:ui

      - name: Build registry
        run: pnpm build:registry

      - name: Test (@kinetixui/ui)
        run: pnpm --filter @kinetixui/ui test

      - name: Generated files in sync
        run: |
          if ! git diff --exit-code -- \
            packages/tokens/dist \
            apps/web/public/r \
            apps/web/public/specs \
            registry/registry.json \
            registry/kinetixui \
            specs/components; then
            echo "::error::Generated output is stale. Run 'pnpm build:tokens && pnpm build:registry' and commit the result."
            exit 1
          fi

      - name: Build site
        run: pnpm build:web

      - name: Typecheck (@kinetixui/ui)
        run: pnpm --filter @kinetixui/ui typecheck
        continue-on-error: true
