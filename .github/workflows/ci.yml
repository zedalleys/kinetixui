name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build:tokens

      - name: Build @kinetixui/ui
        run: pnpm build:ui

      - name: Build registry
        run: pnpm build:registry

      - name: Generated files in sync
        run: |
          if ! git diff --exit-code -- \
            packages/tokens/dist \
            apps/web/public/r \
            registry/registry.json \
            registry/kinetixui; then
            echo "::error::Generated output is stale. Run 'pnpm build:tokens && pnpm build:registry' and commit the result."
            exit 1
          fi

      - name: Build site
        run: pnpm build:web

      - name: Typecheck (@kinetixui/ui)
        run: pnpm --filter @kinetixui/ui typecheck
        continue-on-error: true
