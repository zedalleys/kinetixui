name: Accessibility (browser)

# Real-browser axe pass over every Storybook story, light + dark. Complements the
# jsdom axe test in `ci.yml` (which can't see layout, so it skips colour contrast).
# Path-filtered so it only runs when something that can change rendering does.
#
# Every package with stories in the built Storybook belongs in `paths`. `packages/iot/**` was
# missing, so the IoT stories were scanned only when an unrelated package happened to trigger a
# run — five real violations sat on main for a day before a `packages/ui` change surfaced them.
# `scripts/check-a11y-coverage.mjs` now fails CI if a package with stories is absent from this
# list, so the filter cannot silently fall behind the story directory again.
#
# The Angular gates run @kinetixui/angular as a live Angular application (packages/ui-angular/browser,
# bootstrapping the fixtures in packages/ui-angular/src/fixtures), so the whole of `src` is listed: a
# template, style, fixture or usage-example change on its own must run them.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "packages/iot/**"
      - "packages/tokens/**"
      - "tokens/**"
      - "apps/docs/**"
      - "scripts/a11y-browser.mjs"
      - "scripts/a11y-animations.mjs"
      - "scripts/large-text.mjs"
      - "scripts/motion.mjs"
      - "scripts/motion-states.mjs"
      - "scripts/toggle-motion.mjs"
      - "scripts/checkbox-radio-motion.mjs"
      - "scripts/loop-motion.mjs"
      - "scripts/iot-control-strategies.mjs"
      - "scripts/iot-monitoring.mjs"
      - "scripts/card-visual.mjs"
      - "scripts/icon-direction.mjs"
      - "scripts/selection-visual.mjs"
      - "scripts/entry-visual.mjs"
      - "scripts/composite-visual.mjs"
      - "scripts/navigation-visual.mjs"
      - "scripts/overlay-visual.mjs"
      - "scripts/menu-visual.mjs"
      - "scripts/layout-visual.mjs"
      - "scripts/visual-harness.mjs"
      - "scripts/visual-gates.mjs"
      - "packages/ui-angular/src/**"
      - "packages/ui-angular/browser/**"
      - "scripts/angular-browser.mjs"
      - "scripts/angular-overlays.mjs"
      - "scripts/angular-collections.mjs"
      - "scripts/angular-layout.mjs"
      - "scripts/ui-dist-stamp.mjs"
      - "a11y-baseline.json"
      - ".github/workflows/a11y-browser.yml"
  pull_request:
    paths:
      - "packages/ui/**"
      - "packages/iot/**"
      - "packages/tokens/**"
      - "tokens/**"
      - "apps/docs/**"
      - "scripts/a11y-browser.mjs"
      - "scripts/a11y-animations.mjs"
      - "scripts/large-text.mjs"
      - "scripts/motion.mjs"
      - "scripts/motion-states.mjs"
      - "scripts/toggle-motion.mjs"
      - "scripts/checkbox-radio-motion.mjs"
      - "scripts/loop-motion.mjs"
      - "scripts/iot-control-strategies.mjs"
      - "scripts/iot-monitoring.mjs"
      - "scripts/card-visual.mjs"
      - "scripts/icon-direction.mjs"
      - "scripts/selection-visual.mjs"
      - "scripts/entry-visual.mjs"
      - "scripts/composite-visual.mjs"
      - "scripts/navigation-visual.mjs"
      - "scripts/overlay-visual.mjs"
      - "scripts/menu-visual.mjs"
      - "scripts/layout-visual.mjs"
      - "scripts/visual-harness.mjs"
      - "scripts/visual-gates.mjs"
      - "packages/ui-angular/src/**"
      - "packages/ui-angular/browser/**"
      - "scripts/angular-browser.mjs"
      - "scripts/angular-overlays.mjs"
      - "scripts/angular-collections.mjs"
      - "scripts/angular-layout.mjs"
      - "scripts/ui-dist-stamp.mjs"
      - "a11y-baseline.json"
      - ".github/workflows/a11y-browser.yml"

permissions:
  contents: read

concurrency:
  group: a11y-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens and UI
        run: pnpm build:tokens && pnpm build:ui

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Axe pass (every story, light + dark)
        run: pnpm check:a11y-browser

      # verification.json publishes `largeText` for the selection controls off the back of this script, and
      # a claim nothing executes is not evidence: without this step the controls could regress to a px size,
      # or the check itself could break, while CI stayed green and the site still showed them as verified.
      # It belongs in this job rather than its own: the Storybook build and the Chromium install above are
      # exactly what it needs.
      - name: Large-text pass (selection controls at 2x the default font size)
        run: pnpm check:large-text

      # Motion is the one claim a source grep cannot make: `transition` in a class string proves
      # someone typed it, not that anything moves. This drives each declared interaction twice — once
      # normally, once under prefers-reduced-motion — and reads a rendered midpoint out of the
      # browser. Same job for the same reason as large-text: the Storybook build and the Chromium
      # install above are exactly what it needs.
      - name: Motion pass (rendered intermediate states, normal and reduced)
        run: pnpm check:motion

      # MX1b-1a: Toggle and ToggleGroup. The pass above proves the selected colour interpolates over 200ms;
      # this proves the rest: the state layer on 100ms, hover that leaves the selection colour alone and
      # does not stick after a tap on a device that cannot hover, a burst of clicks landing on the last
      # one, the system's selection colours for the chosen item under forced colours, right-to-left order and keys, and no
      # overflow at 320-1280px, 100% and 200% text, light and dark, LTR and RTL.
      - name: Toggle motion (selection 200ms, state layer 100ms, touch, rapid input, forced colours, RTL)
        run: pnpm check:toggle-motion
      # MX1b-1b: Checkbox and RadioGroup. The glyph drawn must be the state announced on every move (the dash under
      # an uncontrolled mixed box, which used to be a tick), fill and border on 200ms, the halo on 100ms, touch,
      # rapid input, forced colours, right-to-left placement and keys, and the same 64-cell matrix.
      - name: Checkbox and RadioGroup motion (glyph matches state, selection 200ms, halo 100ms, touch, rapid input, forced colours, RTL)
        run: pnpm check:checkbox-radio-motion

      # The React Tabs indicator is one bar that travels to the chosen tab; the motion pass proves it moves.
      # This proves it lands on the right tab where strips break: an overflowing strip scrolled by pointer,
      # keyboard and code, a resize, a label that grows, tabs added and removed, the chosen tab disabled or
      # removed, direction and orientation flipped, the strip hidden and shown, 200% text, reduced motion,
      # forced colours, and the pre-hydration edge it takes over from.
      - name: Tabs indicator geometry (scrolling, dynamic tabs, direction, orientation, text size)
        run: pnpm check:tabs-indicator

      # Loops are the case the pass above cannot express: nothing to click, no destination to seek to.
      # This reads whether each loop is really running normally and really stopped under reduced motion
      # (including the Spinner, whose "slow to 3s" class was dead behind the floor), and that the stopped
      # form still has its ring, its role and name, and survives forced colours.
      - name: Loop motion (running normally, stopped and still legible under reduced motion)
        run: pnpm check:loop-motion

      # The IoT control contract (M2A), pressed through: each `IoT/Control strategies` story is a
      # deterministic device script, played in light, dark, keyboard-only, reduced motion, forced colours,
      # RTL and 390px at 200% text, reading back the accessible state, the announced sentence and axe.
      - name: IoT control strategies (lifecycle + strategy, seven browser conditions)
        run: pnpm check:iot-strategies

      # The M3 monitoring and feedback components, read in the same seven conditions: every `IoT/Monitoring`
      # scenario's accessibility-tree sentence, its state words and glyph shapes, the truth rules (unknown is
      # not 0 or offline, stale is marked, acknowledged is not confirmed, origin is never guessed) and axe.
      - name: IoT monitoring (battery, connection, telemetry, feedback, activity, energy; seven conditions)
        run: pnpm check:iot-monitoring

      # Card's surface and state contract, read off rendered pixels in light and dark: the resting edge
      # is softer than the controls inside it, the card is lifted and sits above a grouped section, a static
      # card ignores the pointer, and an interactive one has distinct hover, pressed, selected and focus
      # states plus a hover transition that reduced motion removes. Same Storybook and Chromium as above.
      # Angular's card is measured against every row too: kx-card at rest, and kxCard on a link and a button.
      - name: Card visual contract (React + Angular surface and states, light and dark)
        run: pnpm check:card-visual

      # The selection-control state contract (TOKENS.md, "Selection controls") on rendered pixels, for React
      # (the States stories) and Angular (the DOM Angular renders for the same states, painted with the
      # package's styles.css): a 3:1 unchecked edge, hover and press as distinct state layers, checked as a
      # shape, a focus ring nothing covers, invalid that survives hover, inert disabled, the chosen segment
      # above its track in both themes, and a state-layer transition that reduced motion removes.
      - name: Selection-control visual contract (React + Angular, light and dark)
        run: pnpm check:selection-visual

      # The text-entry and navigation state contract (TOKENS.md, "Text entry and navigation") on rendered
      # pixels, for React (the EntryStates / States stories) and Angular (the DOM Angular renders, painted
      # with its styles.css): a 3:1 field edge, hover that changes it without competing with focus or erasing
      # invalid, read-only distinct from editable and disabled, a readable-but-quieter placeholder, inert
      # disabled, a selected tab that is more than a text colour in both themes, and hover transitions that
      # reduced motion removes.
      - name: Text-entry and navigation visual contract (React + Angular, light and dark)
        run: pnpm check:entry-visual

      # The composite-field state contract (TOKENS.md, "Composite fields") on rendered pixels: InputGroup,
      # NumberInput, MultiSelect and InputOTP in React; InputGroup, NumberInput, InputOTP and PasswordInput in
      # Angular. The text-entry
      # contract above, held by the wrapper the reader sees as the field — plus one edge (no part doubles the
      # boundary), quieter internal dividers, and focus owned by the part that has it.
      - name: Composite-field visual contract (React + Angular, light and dark)
        run: pnpm check:composite-visual

      # The navigation and disclosure state contract (TOKENS.md, "Navigation and disclosure") on rendered
      # pixels, Angular only: every destination's rest, hover, pressed, focus, current (a shape cue, not hue
      # alone) and disabled states, the accordion's chevron and locked/disabled triggers, the current bar's side
      # in RTL, and the hover colour transition with and without reduced motion.
      - name: Navigation and disclosure visual contract (Angular, light and dark)
        run: pnpm check:navigation-visual

      # The overlay surface contract (TOKENS.md, "Overlays") on rendered pixels, Angular only: every surface
      # open — the scrim, the popover fill and full border edge, elevation (a shadow in light, the surface step
      # in dark), corner shapes, focus rings that the surface's own clip does not cut, the close button's hover
      # and its motion, a popover painted beyond a clipped card, an end sheet on the correct edge in LTR and RTL,
      # and the tooltip's edge under forced colours.
      - name: Overlay visual contract (Angular, light and dark)
        run: pnpm check:overlay-visual

      # The menu item state contract (TOKENS.md, "Menus") on rendered pixels, Angular only: the menu surface
      # (popover fill, border edge, shadow or surface step), an item at rest, hovered (the state layer, no ring),
      # keyboard-highlighted (the same layer AND an inset ring that clears 3:1, so the two never look the same),
      # pressed, disabled, checked marks, destructive, the sub trigger's chevron and open state, the submenu
      # toward the inline end, separators, labels and shortcuts, the menubar's triggers, in LTR and RTL.
      - name: Menu visual contract (Angular, light and dark)
        run: pnpm check:menu-visual

      # The layout and pointer state contract (TOKENS.md, "Layout and pointer") on rendered pixels, Angular only:
      # the scroll area's thumb (3:1 at rest, stronger on hover and drag), its bars beside the content and its
      # focus ring on all four edges; the resizable rule at rest, hover and drag, its focus ring, grip and disabled
      # state; the carousel's controls (placement, glyph direction, focus ring, an end control) and a focused
      # slide's ring; the comparison divider at its value, its handle's grip, focus ring and labels; in light and
      # dark, LTR and RTL, at normal and 200% text.
      - name: Layout and pointer visual contract (Angular, light and dark)
        run: pnpm check:layout-visual

      # Which way React's component-owned directional icons point, read from ink in LTR and in an RTL preview
      # scoped to the story root (never <html>): Back, Previous / Next and the breadcrumb separator mirror; a
      # collapsed disclosure mirrors; an expanded disclosure and the accordion chevron do not (/docs/icons).
      - name: Icon direction (React, LTR and scoped RTL)
        run: pnpm check:icon-direction

      # @kinetixui/angular as a live Angular application in this Chromium: every usage example and state
      # fixture under axe (light and dark, forced colours, reduced motion), every interactive component driven
      # by a real keyboard, direction in four cases, 200% text, and the motion of the switch and the disclosures. verification.json
      # publishes Angular's browser evidence off this script, so it runs wherever the Angular sources change.
      - name: Angular in the browser (axe, keyboard, RTL, 200% text, reduced motion)
        run: pnpm check:angular-browser

      # The overlay family as a live Angular application: each overlay driven alone and nested (dialog →
      # popover → tooltip, dialog → dialog, sheet → popover) by keyboard and pointer — Escape one layer at a
      # time, outside presses, focus in, held and restored, the page scroll lock, the stack's listeners — then
      # axe on every surface OPEN, forced colours, four direction cases, 200% text at 1024px and 390px, and the
      # open/close motion with and without reduced motion. verification.json publishes this evidence.
      - name: Angular overlays in the browser (nesting, focus, axe open, RTL, 200% text, motion)
        run: pnpm check:angular-overlays

      # The menus (dropdown menu, context menu, menubar) as a live Angular application on the collection core:
      # arrows that stop or wrap, Home/End, typeahead, disabled items, activation and focus return, Escape one
      # level at a time, Tab, outside presses, submenus by keyboard, hover intent and the diagonal grace area,
      # context menus at the pointer and from the keyboard, the menubar's moves between menus; then axe with
      # menus and submenus open (and inside a dialog), forced colours, four direction cases, 200% text at 1024px
      # and 390px, and the open/close motion with and without reduced motion. verification.json publishes this.
      - name: Angular menus in the browser (keyboard, pointer, submenus, axe open, RTL, 200% text, motion)
        run: pnpm check:angular-collections

      # Scroll area, resizable, carousel and comparison slider as a live Angular application: keyboard, mouse,
      # pen and touch (DevTools input, so the pointer events are the browser's own); releases outside, a group
      # resized and a handle disabled mid-drag, lost capture and touch cancel; content and containers that resize;
      # the page instrumented so pointer listeners exist only while a drag runs and no ResizeObserver outlives its
      # component; then axe (light and dark), forced colours, four direction cases, 320–1280px at normal and 200%
      # text, and the carousel's motion with and without reduced motion. verification.json publishes this.
      - name: Angular layout, pointer and scroll in the browser (keyboard, pointer, touch, teardown, RTL, 200% text, motion)
        run: pnpm check:angular-layout
