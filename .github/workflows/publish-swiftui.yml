name: Publish (SwiftUI)

# Manual — SwiftPM can't consume a package from a monorepo subdirectory,
# so distribution is a `git subtree split` of packages/ui-swiftui pushed
# to a thin mirror repo (Package.swift lands at the mirror root). Set the
# SWIFTUI_MIRROR_REPO secret to an authenticated push URL, e.g.
#   https://x-access-token:<PAT>@github.com/<you>/kinetix-ui-swift.git
#
# Defaults to a dry run: the split and the tag are computed and reported,
# nothing is pushed. A real publish needs `dry_run: false` AND the secret.
# Previously the only thing standing between a dispatch and a permanent tag
# was whether the secret happened to be unset, which meant the workflow
# became irreversible the moment it was configured — and there was then no
# way to rehearse it at all.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer tag for the mirror, e.g. 0.1.0"
        required: true
      dry_run:
        description: "dry run only — split and report, nothing pushed"
        type: boolean
        default: true

permissions:
  contents: read

# A second dispatch must not force-push the same mirror branch while the
# first is still pushing it.
concurrency:
  group: publish-swiftui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The preflight now reads these workflows through a YAML parser rather than a
      # hand-written one, because three rounds of review found a spelling the
      # hand-written reader could not see and each time the unread file passed. That
      # costs this workflow its bare-checkout independence: the gate needs its one
      # dependency installed before it can run. It is rehearsal-safe, it runs before
      # anything is validated, and if it fails the job fails and nothing is published.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (the preflight's parser)
        working-directory: .
        run: pnpm install --frozen-lockfile

      # A typo here becomes a git tag that `from:` resolves against forever,
      # so it is rejected before the toolchain is even warmed up.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-native-publish-preflight.mjs --version="$VERSION"

      - name: Preflight
        run: node scripts/check-native-publish-preflight.mjs

      # Shape is not authorization. The step above proves the dispatch input *could* be a version;
      # this proves it is the one release/native-release-lines.json declares for this line, so the
      # number that reaches an irreversible registry has been through review rather than typed into
      # a dispatch box. `authorizedNext: null` there means no publish is authorized, and that is the
      # current declared state.
      #
      # Gated by the publication's own condition, deliberately: a dry run must keep rehearsing the
      # whole release path under any shape-valid version, which is how a defect in that path is
      # found without publishing anything.
      - name: Authorize the version
        if: ${{ inputs.dry_run == false }}
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-native-publish-preflight.mjs --authorize-version="$VERSION" --line=ui-swiftui

      - name: Build sanity
        run: swift build --package-path packages/ui-swiftui

      # Compiling proves the split will compile; the suite is what proves this
      # commit is the one the native workflow went green on.
      - name: Test
        run: swift test --package-path packages/ui-swiftui

      # Rehearsal. Everything here is safe to run on a dry run and must stay
      # unconditional, so a dry run exercises the real release path rather than
      # a shorter one: the split, the manifest probe, and the tag computation.
      - name: Split the subtree and verify the mirror layout
        id: split
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git subtree split --prefix=packages/ui-swiftui -b swiftui-dist
          SHA=$(git rev-parse swiftui-dist)
          echo "subtree split → $SHA"
          # The mirror root is what a consumer sees; prove the manifest is there
          # before pushing a tag that cannot be moved.
          if ! git cat-file -e "$SHA:Package.swift" 2>/dev/null; then
            echo "::error::Package.swift is not at the root of the subtree split. A .package(url:) consumer cannot resolve this mirror."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN:-}" != "false" ]; then
            echo "::notice::Not a live publish (dry_run=${DRY_RUN:-<unset>}) — would tag $SHA as $VERSION. Nothing pushed."
          fi

      # The only side effects in this workflow live here, and GitHub Actions —
      # not the shell — decides whether this step runs at all. The step-level
      # condition is evaluated before a shell exists, so nothing inside `run:`
      # can reach it: that is the whole reason the pushes were moved out of the
      # rehearsal step above. Compose and Flutter gate their publications the
      # same way.
      #
      # The in-script guard below is defense in depth, not the proof. It is what
      # the six-value behavioural control measures, and it is what stops a
      # publish if this step is ever reached with a non-`false` value.
      - name: Push to mirror
        if: ${{ inputs.dry_run == false }}
        env:
          MIRROR: ${{ secrets.SWIFTUI_MIRROR_REPO }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ steps.split.outputs.sha }}
        run: |
          # Affirmative polarity, deliberately. Asking "is the safe flag set?" let every value that
          # is not the exact string `true` — empty, unset, `False`, `yes` — fall through to the two
          # pushes below, which are a permanent tag on a public mirror. Asking "was a live publish
          # explicitly requested?" means only `false` can reach them.
          if [ "${DRY_RUN:-}" != "false" ]; then
            echo "::notice::Not a live publish (dry_run=${DRY_RUN:-<unset>}) — nothing pushed."
            exit 0
          fi
          if [ -z "$MIRROR" ]; then
            echo "::error::SWIFTUI_MIRROR_REPO is not set. Add the mirror's authenticated push URL as that secret, or run with dry_run: true."
            exit 1
          fi
          # Before the force-push, not after: the tag push below would be rejected on its own, but
          # by then main has already moved and the mirror is left ahead of its last tag.
          node scripts/publish/swiftui-tag-available.mjs "$MIRROR" "$VERSION"
          git push --force "$MIRROR" swiftui-dist:main
          git push "$MIRROR" "$SHA:refs/tags/$VERSION"
          echo "Published. Consumers: .package(url: \"<mirror-url>\", from: \"$VERSION\")"
