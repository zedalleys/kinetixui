org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# --- Publishing (see ui/build.gradle.kts + .github/workflows/publish-compose.yml) ---
# Real values come from CI secrets or your ~/.gradle/gradle.properties, never here:
#   mavenCentralUsername=          Central Portal user token
#   mavenCentralPassword=          Central Portal token password
#   signingInMemoryKey=            ASCII-armored GPG private key (newline-joined)
#   signingInMemoryKeyPassword=    its passphrase (omit if none)
#   VERSION_NAME=                  overrides the 0.1.0 default in the build script
