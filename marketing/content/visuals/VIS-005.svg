<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<rect width="1200" height="786" fill="#0c1229"/>
<rect x="0" y="0" width="1200" height="6" fill="#a78bfa"/>
<text x="64" y="92" font-size="20" font-weight="600" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">the trade</text><text x="64" y="150" font-size="46" font-weight="700" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Neither is a mistake.</text><text x="64" y="196" font-size="23" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Know which one you are buying.</text><rect x="64" y="256" width="520" height="400" rx="12" fill="#1c2945" stroke="#d4daec" stroke-width="2" opacity="1"/><text x="92" y="304" font-size="26" font-weight="700" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">One runtime</text><text x="92" y="356" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">your code</text><text x="92" y="402" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">  ↓</text><text x="92" y="448" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">a drawing layer</text><text x="92" y="494" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">  ↓</text><text x="92" y="540" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">every platform</text><text x="92" y="608" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Cost lives at the edges.</text><rect x="616" y="256" width="520" height="400" rx="12" fill="#1c2945" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="644" y="304" font-size="26" font-weight="700" fill="#a78bfa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Native implementations</text><text x="644" y="356" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">a shared contract</text><text x="644" y="402" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">  ↓</text><text x="644" y="448" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">five implementations</text><text x="644" y="494" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">  ↓</text><text x="644" y="540" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">each platform's idiom</text><text x="644" y="608" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Cost lives in the maintenance.</text><text x="64" y="708" font-size="22" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">KinetixUI takes the second. The gaps get published instead of abstracted away.</text>
<text x="64" y="750" font-size="20" fill="#d4daec" opacity="0.75">kinetixui.com</text>
</svg>
