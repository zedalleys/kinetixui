<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker></defs><text x="64" y="92" font-size="20" font-weight="600" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">one source</text><text x="64" y="150" font-size="46" font-weight="700" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">One manifest. Every surface.</text><text x="64" y="196" font-size="23" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">The alternative is a sentence in a docs page that nothing ever reads again.</text><rect x="420" y="256" width="360" height="96" rx="12" fill="#1c2945" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="600" y="300" font-size="21" font-weight="600" fill="#f6f7fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">components.manifest.json</text><text x="600" y="330" font-size="20" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle" opacity="1">the only declaration</text><line x1="600" y1="356" x2="184" y2="450" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="64" y="456" width="240" height="72" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="184" y="500" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle" opacity="1">coverage table</text><line x1="600" y1="356" x2="456" y2="450" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="336" y="456" width="240" height="72" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="456" y="500" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle" opacity="1">component pages</text><line x1="600" y1="356" x2="728" y2="450" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="608" y="456" width="240" height="72" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="728" y="500" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle" opacity="1">platform docs</text><line x1="600" y1="356" x2="1000" y2="450" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="880" y="456" width="240" height="72" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="1000" y="500" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle" opacity="1">marketing copy</text><rect x="420" y="608" width="360" height="72" rx="12" fill="#1c2945" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" opacity="1"/><text x="600" y="652" font-size="20" font-weight="400" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">check:platform-source</text><line x1="600" y1="606" x2="600" y2="360" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="64" y="728" font-size="22" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">The check reads the manifest back against the filesystem.</text><text x="64" y="762" font-size="22" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">It found a component claiming three native platforms with an implementation on none.</text>
<text x="64" y="802" font-size="20" fill="#d4daec" opacity="0.75">kinetixui.com</text>
