t-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">radius   12</text><text x="788" y="756" font-size="20" font-weight="400" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">accent   #1f4a63</text><text x="64" y="876" font-size="22" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Each change was locally correct. None was written anywhere the others could see.</text><text x="64" y="912" font-size="22" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">A shared token source makes the difference a decision instead of an accident.</text>
