<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker></defs><text x="64" y="92" font-size="20" font-weight="600" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">verification</text><text x="64" y="150" font-size="46" font-weight="700" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">A claim without source fails the build.</text><text x="64" y="196" font-size="23" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Three of these caught false claims in this repository before anyone read them.</text><rect x="64" y="256" width="190" height="60" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="159" y="294" font-size="20" font-weight="600" fill="#f6f7fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">CLAIM</text><line x1="258" y1="286" x2="282" y2="286" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="286" y="256" width="190" height="60" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="381" y="294" font-size="20" font-weight="600" fill="#f6f7fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">SOURCE</text><line x1="480" y1="286" x2="504" y2="286" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="508" y="256" width="190" height="60" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="603" y="294" font-size="20" font-weight="600" fill="#f6f7fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">CHECK</text><line x1="702" y1="286" x2="726" y2="286" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="730" y="256" width="190" height="60" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="825" y="294" font-size="20" font-weight="600" fill="#f6f7fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">CI</text><line x1="924" y1="286" x2="948" y2="286" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="952" y="256" width="190" height="60" rx="12" fill="#1c2945" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="1047" y="294" font-size="20" font-weight="600" fill="#f6f7fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" opacity="1">PUBLIC</text><rect x="64" y="366" width="1072" height="92" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="88" y="402" font-size="21" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">a component claims SwiftUI</text><text x="88" y="434" font-size="20" font-weight="400" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">check:platform-source</text><text x="1112" y="420" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end" opacity="1">no SwiftUI source → build fails</text><rect x="64" y="478" width="1072" height="92" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="88" y="514" font-size="21" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">a docs page shows Compose code</text><text x="88" y="546" font-size="20" font-weight="400" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">check:platform-code</text><text x="1112" y="532" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end" opacity="1">symbol not in the package → build fails</text><rect x="64" y="590" width="1072" height="92" rx="12" fill="#1c2945" stroke="#395a70" stroke-width="2" opacity="1"/><text x="88" y="626" font-size="21" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">a registry item ships a file</text><text x="88" y="658" font-size="20" font-weight="400" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">check:registry-deps</text><text x="1112" y="644" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end" opacity="1">undeclared import → build fails</text><text x="64" y="744" font-size="22" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">The marketing copy is under the same gates as the code.</text>
<text x="64" y="786" font-size="20" fill="#d4daec" opacity="0.75">kinetixui.com</text>
