city="1">02 · COMPONENTS</text><text x="92" y="484" font-size="26" font-weight="600" fill="#f0f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Copy what you need</text><text x="500" y="460" font-size="20" font-weight="400" fill="#92b2c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">The CLI writes source into your repo and installs what those f</text><text x="500" y="488" font-size="20" font-weight="400" fill="#92b2c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">iles import. Yours to edit.</text><rect x="64" y="552" width="1072" height="124" rx="12" fill="#050c11" stroke="#395a70" stroke-width="2" opacity="1"/><text x="92" y="594" font-size="20" font-weight="400" fill="#92b2c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">03 · BLOCKS</text><text x="92" y="632" font-size="26" font-weight="600" fill="#f0f7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Whole patterns</text><text x="500" y="608" font-size="20" font-weight="400" fill="#92b2c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">20 composed sections with real source on every platform that l</text><text x="500" y="636" font-size="20" font-weight="400" fill="#92b2c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">ists them.</text>
