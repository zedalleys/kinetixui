<rect x="0" y="0" width="1200" height="6" fill="#a78bfa"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker></defs><text x="64" y="92" font-size="20" font-weight="600" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">tokens — generated</text><text x="64" y="150" font-size="46" font-weight="700" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">One source. Every platform's own output.</text><text x="64" y="196" font-size="23" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">This flow is for tokens. Components are a different story — see the companion card.</text><rect x="64" y="256" width="380" height="120" rx="12" fill="#1c2945" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="88" y="302" font-size="22" font-weight="600" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">tokens/ — DTCG source</text><text x="88" y="338" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">one file, hand-written</text><rect x="520" y="276" width="200" height="80" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="620" y="324" font-size="20" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle" opacity="1">generators</text><line x1="450" y1="316" x2="514" y2="316" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><line x1="726" y1="316" x2="790" y2="430" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="796" y="396" width="340" height="68" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="820" y="426" font-size="21" font-weight="600" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Web</text><text x="820" y="450" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">CSS custom properties</text><line x1="726" y1="316" x2="790" y2="522" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="796" y="488" width="340" height="68" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="820" y="518" font-size="21" font-weight="600" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">iOS</text><text x="820" y="542" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">Swift constants</text><line x1="726" y1="316" x2="790" y2="614" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="796" y="580" width="340" height="68" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="820" y="610" font-size="21" font-weight="600" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Android</text><text x="820" y="634" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">Kotlin objects</text><line x1="726" y1="316" x2="790" y2="706" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><rect x="796" y="672" width="340" height="68" rx="12" fill="#0c1229" stroke="#395a70" stroke-width="2" opacity="1"/><text x="820" y="702" font-size="21" font-weight="600" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Flutter</text><text x="820" y="726" font-size="20" font-weight="400" fill="#d4daec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" opacity="1">Dart constants</text><text x="64" y="804" font-size="22" font-weight="400" fill="#f6f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">Generated files are build artifacts, committed and reviewed —</text><text x="64" y="838" font-size="22" font-weight="400" fill="#d4daec" font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="start" opacity="1">so a value changed once moves every platform in one commit.</text>
<text x="64" y="878" font-size="20" fill="#d4daec" opacity="0.75">kinetixui.com</text>
</svg>
