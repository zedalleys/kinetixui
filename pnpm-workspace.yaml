packages:
  - "packages/*"
  - "apps/*"
overrides:
  fast-uri: "3.1.6"
  # force next's bundled postcss past GHSA-qx2v-qp2m-jg93 / -fxqj-rqcc-2cmp
  # (arbitrary .map file read via sourceMappingURL; build-time only). Drop once
  # next ships a patched postcss.
  "postcss@<8.5.28": "^8.5.28"
  # vite 7.3.6 still resolves esbuild 0.27.x — GHSA-67mh-4wv8-2f99 (dev-server
  # arbitrary file read on Windows) is fixed in 0.28.1. API-compatible for
  # vite's use. Drop once vite bumps its esbuild floor.
  "esbuild@<0.28.1": "^0.28.2"
allowBuilds:
  # ng-packagr pulls this in for `--watch`; the library is only ever built one-shot, so its native
  # binary is dead weight and its install script is declined rather than approved.
  '@parcel/watcher': false
  '@bundled-es-modules/glob': true
  core-js: false
  esbuild: true
  msw: true
  style-dictionary: true
  unrs-resolver: false
  # ng-packagr's build cache (lmdb) and its msgpack codec ship native binaries. The library build does not
  # need the cache, so their install scripts are declined rather than approved.
  lmdb: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - autoprefixer@10.6.1
  - vitest@5.0.1
