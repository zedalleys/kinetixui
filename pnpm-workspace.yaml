packages:
  - "packages/*"
  - "apps/*"
overrides:
  fast-uri: "3.1.6"
  # force next's bundled postcss past GHSA-qx2v-qp2m-jg93 / -fxqj-rqcc-2cmp
  # (arbitrary .map file read via sourceMappingURL; build-time only). Drop once
  # next ships a patched postcss.
  "postcss@<8.5.28": "^8.5.28"
  # vite 7.3.6 still resolves esbuild 0.27.x — GHSA-67mh-4wv8-2f99 (dev-server
  # arbitrary file read on Windows) is fixed in 0.28.1. API-compatible for
  # vite's use. Drop once vite bumps its esbuild floor.
  "esbuild@<0.28.1": "^0.28.2"
  # recharts declares react-is as a REQUIRED peer over `^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0`,
  # and react-is predicates are not version-agnostic: React 19 renamed the element brand to
  # `react.transitional.element`, and react-is only recognises its own major's brand. react-is 18
  # beside React 19 therefore returns false from isFragment() for a real Fragment. recharts uses
  # isFragment() to flatten children before findAllByType(children, Cell), so a Fragment-wrapped
  # <Cell> is dropped and its fill is silently lost — measured in Chromium. Pin the peer to the
  # major of the React this repo develops against. scripts/adoption/react-is-agreement.mjs holds it.
  # Drop once recharts stops detecting Fragments with react-is.
  "recharts>react-is": "^19.0.0"
allowBuilds:
  # ng-packagr pulls this in for `--watch`; the library is only ever built one-shot, so its native
  # binary is dead weight and its install script is declined rather than approved.
  '@parcel/watcher': false
  '@bundled-es-modules/glob': true
  core-js: false
  esbuild: true
  msw: true
  style-dictionary: true
  unrs-resolver: false
  # ng-packagr's build cache (lmdb) and its msgpack codec ship native binaries. The library build does not
  # need the cache, so their install scripts are declined rather than approved.
  lmdb: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - autoprefixer@10.6.1
  - vitest@5.0.1
